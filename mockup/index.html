<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Água · Mockup</title>
<style>
*{box-sizing:border-box}
:root{--ink:#111;--ink2:#6b6b6b;--line:#e8e8e8;--bg:#f5f5f5;--card:#fff;--water:#cdeaf7;--water2:#8fd0ee}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:0 12px 24px}
.brand .ic{width:22px;height:22px}
nav{display:flex;flex-direction:column;gap:6px}
nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:10px;font:inherit;color:var(--ink2);cursor:pointer;text-align:left}
nav button.on{background:var(--ink);color:#fff}
.foot{margin-top:auto;padding:12px;font-size:12px;color:var(--ink2)}
main{padding:36px 40px;max-width:1160px;width:100%}
h1{font-size:34px;font-weight:800;margin:4px 0 0;letter-spacing:-.03em}
h2{font-size:16px;margin:0 0 4px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.cap{margin:0;color:var(--ink2)}
.muted{color:var(--ink2);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi strong{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.kpi strong span{font-size:14px;color:var(--ink2);font-weight:500}
.kicon{display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px}
.main-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:20px}
.hero{position:relative;overflow:hidden;display:flex;gap:32px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,#fff 0%,#f3f3f3 100%);margin:0}
.deco{position:absolute;right:-60px;bottom:-80px;width:380px;height:auto;pointer-events:none}
.glass{width:124px;height:176px;flex:none;position:relative}
.big{font-size:60px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.big span{font-size:20px;color:var(--ink2);font-weight:500}
.bar{height:8px;background:#e6e6e6;border-radius:99px;margin:16px 0 22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--water2);border-radius:99px;transition:width .4s}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:600;padding:11px 18px;border-radius:99px;border:1px solid var(--ink);cursor:pointer;background:#fff;color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.btn:hover{opacity:.85}
.ic{width:18px;height:18px;flex:none}
.pill{font-size:13px;font-weight:600;padding:6px 14px;border-radius:99px;border:1px solid var(--ink);white-space:nowrap}
.pill.on{background:var(--ink);color:#fff}
.pill.off{color:var(--ink2);border-color:var(--line)}
.pill.wait{border-style:dashed}
.dark{background:#111;border-color:#111;color:#fff}
.dark h2{color:#fff}
.dark .muted{color:#9a9a9a}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.ring{text-align:center}
.ring svg{width:100%;max-width:110px;display:block;margin:0 auto}
.rt{fill:none;stroke:#2a2a2a;stroke-width:8}
.rv{fill:none;stroke:var(--water2);stroke-width:8;stroke-linecap:round}
.ring strong{display:block;font-size:22px;font-weight:800;margin-top:8px}
.ring small{color:#9a9a9a;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.times{list-style:none;padding:0;margin:16px 0 0}
.times li{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.times li span{font-variant-numeric:tabular-nums;font-weight:600}
.times li small{color:var(--ink2)}
.times li.past span{color:#aaa;text-decoration:line-through}
.times li.next small{color:var(--ink);font-weight:700}
.label{font-size:13px;color:var(--ink2);margin:20px 0 8px;font-weight:600}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2)}
input[type=time],input[type=number]{font:inherit;color:var(--ink);padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.chips,.days{display:flex;gap:8px;flex-wrap:wrap}
.chip,.day{font:inherit;font-size:14px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.chip.on,.day.on{background:var(--ink);border-color:var(--ink);color:#fff}
.day{width:46px;padding:8px 0;text-align:center}
.chip-input{width:110px;border-radius:99px;padding:7px 12px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.switch{position:relative;width:44px;height:26px;border-radius:99px;border:1px solid var(--ink);background:#fff;cursor:pointer;padding:0;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:.2s}
.switch.on{background:var(--ink)}
.switch.on i{left:21px;background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.stat strong{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em}
.chart{width:100%;height:auto;margin-top:12px}
.overlay{position:fixed;inset:0;background:rgba(17,17,17,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.overlay[hidden]{display:none}
.alert{width:min(380px,100%);text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:32px 28px}
.alert .x{position:absolute;top:12px;right:12px;background:none;border:0;cursor:pointer;color:var(--ink)}
.alert .row{justify-content:center;margin-top:12px}
.wv{animation:wave 3s linear infinite}
@keyframes wave{to{transform:translateX(-30px)}}
@media print{aside,.row,.top .row,.overlay{display:none}main{padding:0}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{flex-direction:row;overflow-x:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line);align-items:center}
  .brand{padding:0 8px 0 0;white-space:nowrap}
  nav{flex-direction:row}
  nav button{white-space:nowrap}
  .foot{display:none}
  main{padding:20px 16px}
  .kpis{grid-template-columns:1fr 1fr}
  .main-grid,.grid,.stats{grid-template-columns:1fr}
  .big{font-size:46px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-6h16v6h-3M7 14h10v7H7z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  </defs>
</svg>

<div class="app">
  <aside>
    <div class="brand"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-drop"/></svg>Água</div>
    <nav id="nav"></nav>
    <p class="foot">Funciona offline · sem conta</p>
  </aside>
  <main id="main"></main>
</div>

<div class="overlay" id="ov" hidden></div>

<script>
const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const S={
  view:'hoje', start:'06:30', end:'16:18', iv:60,
  days:[false,true,true,true,true,true,false],
  autostart:true, sound:true, visual:true,
  goal:2500, glass:250, ml:1250, taken:0,
  hist:[2100,1600,2500,1900,2300,1750] // 6 dias anteriores, do mais antigo ao mais recente
};
let lastFire=-1, lastMin=-1;

const pad=n=>String(n).padStart(2,'0');
const toM=h=>{const [a,b]=h.split(':').map(Number);return a*60+b};
const fmt=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function times(){
  const r=[],s=toM(S.start),e=toM(S.end);
  if(S.iv>=5) for(let t=s+S.iv;t<=e;t+=S.iv) r.push(t);
  return r;
}
function statusInfo(){
  const d=new Date(),m=nowMin();
  if(!S.days[d.getDay()]) return{tone:'off',txt:'Dia desligado',sub:'Sem lembretes hoje'};
  if(m<toM(S.start)) return{tone:'wait',txt:'Começa às '+S.start,sub:'Primeiro lembrete depois do início'};
  if(m>toM(S.end)) return{tone:'off',txt:'Encerrado por hoje',sub:'Volta amanhã às '+S.start};
  const nx=times().find(t=>t>m);
  if(nx===undefined) return{tone:'off',txt:'Sem lembretes restantes',sub:'Expediente de lembretes concluído'};
  const diff=nx-m;
  const dt=diff>=60?Math.floor(diff/60)+'h'+pad(diff%60):diff+' min';
  return{tone:'on',txt:'Próximo em '+dt,sub:'Às '+fmt(nx)};
}
function ic(name){return `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${name}"/></svg>`}

function glass(p){
  const y=152-140*p;
  const shape="M46 10h28v18l14 22v98a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V50l14-22z";
  return `<svg class="glass" viewBox="0 0 120 170" aria-hidden="true">
    <defs><clipPath id="cp"><path d="${shape}"/></clipPath></defs>
    <g clip-path="url(#cp)"><g transform="translate(0 ${y})"><g class="wv"><path d="M-30 0q15-8 30 0t30 0t30 0t30 0t30 0t30 0V170H-30z" fill="#8fd0ee"/></g></g>
    <rect x="0" y="${y+30}" width="120" height="140" fill="#cdeaf7"/></g>
    <path d="${shape}" fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M52 4h16" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  </svg>`;
}
function ring(v,label){
  const c=2*Math.PI*34, x=Math.max(0,Math.min(v,1));
  return `<div class="ring"><svg viewBox="0 0 84 84" aria-hidden="true">
    <circle cx="42" cy="42" r="34" class="rt"/>
    <circle cx="42" cy="42" r="34" class="rv" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-x)}" transform="rotate(-90 42 42)"/>
  </svg><strong>${Math.round(x*100)}%</strong><small>${label}</small></div>`;
}
function kpi(icon,label,val,unit){
  return `<section class="card kpi"><span class="kicon">${ic(icon)}</span><p class="muted" style="margin-top:12px">${label}</p><strong>${val}${unit?` <span>${unit}</span>`:''}</strong></section>`;
}
function sw(label,key){
  return `<div class="sw"><span>${label}</span><button class="switch ${S[key]?'on':''}" role="switch" aria-checked="${S[key]}" onclick="flip('${key}')"><i></i></button></div>`;
}

function hoje(){
  const st=statusInfo(), p=Math.min(S.ml/S.goal,1), ts=times(), now=nowMin(), nx=ts.find(t=>t>now);
  const passed=ts.filter(t=>t<=now).length;
  const dt=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const list=ts.map(t=>{
    const c=t<now?'past':t===nx?'next':'';
    const lb=t<now?'passou':t===nx?'próximo':'agendado';
    return `<li class="${c}"><span>${fmt(t)}</span><small>${lb}</small></li>`;
  }).join('')||'<li class="muted">Nenhum horário com essa configuração</li>';
  return `
  <header class="top">
    <div><p class="cap">${dt}</p><h1>Hoje</h1></div>
    <span class="pill ${st.tone}" id="pill">${st.txt}</span>
  </header>
  <div class="kpis">
    ${kpi('drop','Água hoje',S.ml,'ml')}
    ${kpi('check','Copos bebidos',Math.floor(S.ml/S.glass))}
    ${kpi('bell','Lembretes hoje',ts.length)}
    ${kpi('clock','Intervalo',S.iv,'min')}
  </div>
  <div class="main-grid">
    <section class="card hero">
      <svg class="deco" viewBox="0 0 380 260" aria-hidden="true" fill="none" stroke="#d9d9d9" stroke-width="1.5">
        <path d="M0 160c60-60 120 40 180-20s110-60 200 10"/>
        <path d="M0 200c70-50 130 30 190-10s100-50 190 5"/>
        <path d="M20 120c50-30 100 30 150-5s90-30 160 10"/>
      </svg>
      ${glass(p)}
      <div style="position:relative">
        <p class="muted">Meta de água de hoje</p>
        <div class="big">${S.ml} <span>ml</span></div>
        <p class="muted">de ${S.goal} ml · faltam ${Math.max(S.goal-S.ml,0)} ml</p>
        <div class="bar"><i style="width:${p*100}%"></i></div>
        <div class="row">
          <button class="btn dark" onclick="drink(false)">${ic('drop')} Bebi ${S.glass} ml</button>
          <button class="btn" onclick="alertOn(true)">${ic('bell')} Testar alerta</button>
        </div>
      </div>
    </section>
    <section class="card dark">
      <h2>Progresso de hoje</h2>
      <p class="muted" id="sub">${st.sub}</p>
      <div class="rings">
        ${ring(p,'Meta de água')}
        ${ring(ts.length?passed/ts.length:0,'Lembretes')}
        ${ring(passed?S.taken/passed:0,'Atendidos')}
      </div>
    </section>
  </div>
  <div class="grid">
    <section class="card">
      <h2>Lembretes de hoje</h2>
      <p class="muted">Intervalo de ${S.iv} min entre ${S.start} e ${S.end}</p>
      <ul class="times">${list}</ul>
    </section>
    <section class="card">
      <h2>Horário</h2>
      <div class="fields">
        <label>Início<input type="time" value="${S.start}" onchange="setTime('start',this.value)"></label>
        <label>Fim<input type="time" value="${S.end}" onchange="setTime('end',this.value)"></label>
      </div>
      <p class="label">Intervalo entre lembretes</p>
      <div class="chips">
        ${[30,45,60,90,120].map(n=>`<button class="chip ${S.iv===n?'on':''}" onclick="setIv(${n})">${n} min</button>`).join('')}
        <input class="chip-input" type="number" min="5" max="480" value="${S.iv}" onchange="setIv(this.value)" aria-label="Intervalo personalizado em minutos">
      </div>
      <p class="label">Dias de funcionamento</p>
      <div class="days">${DAYS.map((d,i)=>`<button class="day ${S.days[i]?'on':''}" aria-pressed="${S.days[i]}" onclick="toggleDay(${i})">${d}</button>`).join('')}</div>
      <h2 style="margin-top:24px">Sistema</h2>
      ${sw('Abrir ao ligar o computador','autostart')}
      ${sw('Alerta sonoro','sound')}
      ${sw('Alerta visual em tela cheia','visual')}
    </section>
  </div>`;
}

function relatorios(){
  const DN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const today=new Date();
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(today); d.setDate(today.getDate()-i);
    days.push({d, ml: i===0?S.ml:S.hist[6-i]});
  }
  const avg=Math.round(days.reduce((a,x)=>a+x.ml,0)/7);
  const hit=days.filter(x=>x.ml>=S.goal).length;
  const W=640,base=200,top=30;
  const max=Math.max(S.goal,...days.map(x=>x.ml))*1.1;
  let bars='';
  days.forEach((x,i)=>{
    const h=x.ml/max*(base-top), bx=10+i*86, col=x.ml>=S.goal?'#111':'#c4c4c4';
    bars+=`<rect x="${bx}" y="${base-h}" width="44" height="${h}" rx="6" fill="${col}"/>
      <text x="${bx+22}" y="${base-h-8}" text-anchor="middle" font-size="12" fill="#111">${x.ml}</text>
      <text x="${bx+22}" y="226" text-anchor="middle" font-size="12" fill="#6b6b6b">${DN[x.d.getDay()]}</text>`;
  });
  const gy=base-S.goal/max*(base-top);
  const chart=`<svg class="chart" viewBox="0 0 ${W} 240" role="img" aria-label="Consumo dos últimos 7 dias">
    <line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="#111" stroke-dasharray="4 6"/>
    <text x="${W}" y="${gy-6}" text-anchor="end" font-size="12" fill="#6b6b6b">meta ${S.goal} ml</text>
    ${bars}</svg>`;
  return `
  <header class="top">
    <div><p class="cap">Últimos 7 dias</p><h1>Relatórios</h1></div>
    <div class="row">
      <button class="btn" onclick="exportCsv()">${ic('download')} Exportar CSV</button>
      <button class="btn" onclick="window.print()">${ic('print')} Imprimir / PDF</button>
    </div>
  </header>
  <div class="stats">
    <section class="card stat"><p class="muted">Média diária</p><strong>${avg} ml</strong></section>
    <section class="card stat"><p class="muted">Dias na meta</p><strong>${hit} de 7</strong></section>
    <section class="card stat"><p class="muted">Alertas atendidos hoje</p><strong>${S.taken}</strong></section>
  </div>
  <section class="card">
    <h2>Consumo diário</h2>
    <p class="muted">Barras pretas = meta atingida</p>
    ${chart}
  </section>`;
}

function render(){
  document.getElementById('main').innerHTML = S.view==='hoje'?hoje():relatorios();
  const items=[['hoje','home','Hoje'],['rel','chart','Relatórios']];
  document.getElementById('nav').innerHTML=items.map(([k,i,l])=>
    `<button class="${S.view===(k==='rel'?'relatorios':'hoje')?'on':''}" onclick="go('${k==='rel'?'relatorios':'hoje'}')">${ic(i)} ${l}</button>`).join('');
}
function go(v){S.view=v;render()}
function setTime(k,v){if(!v)return;S[k==='start'?'start':'end']=v;render()}
function setIv(n){n=+n;if(!(n>=5&&n<=480))return;S.iv=n;render()}
function toggleDay(i){S.days[i]=!S.days[i];render()}
function flip(k){S[k]=!S[k];render()}
function drink(fromAlert){S.ml+=S.glass;if(fromAlert)S.taken++;render()}

function beep(){
  if(!S.sound)return;
  try{
    const c=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.45].forEach(t=>{
      const o=c.createOscillator(),g=c.createGain();
      o.frequency.value=880;o.connect(g);g.connect(c.destination);
      g.gain.setValueAtTime(0.0001,c.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.3,c.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t+0.4);
      o.start(c.currentTime+t);o.stop(c.currentTime+t+0.42);
    });
  }catch(e){}
}
function alertOn(manual){
  beep();
  if(!S.visual&&!manual)return;
  const ov=document.getElementById('ov');
  ov.innerHTML=`<div class="alert card" role="dialog" aria-modal="true">
    <button class="x" onclick="alertOff()" aria-label="Fechar">${ic('x')}</button>
    ${glass(S.ml/S.goal)}
    <h2>Hora de beber água</h2>
    <p class="muted">Você está em ${S.ml} ml de ${S.goal} ml.</p>
    <div class="row">
      <button class="btn dark" onclick="drink(true);alertOff()">${ic('drop')} Já bebi ${S.glass} ml</button>
      <button class="btn" onclick="snooze()">Adiar 10 min</button>
    </div>
  </div>`;
  ov.hidden=false;
}
function alertOff(){document.getElementById('ov').hidden=true}
function snooze(){alertOff();setTimeout(()=>alertOn(false),10*60*1000)}

function exportCsv(){
  const today=new Date(),rows=['data,ml,meta_ml,atingiu'];
  for(let i=6;i>=0;i--){
    const d=new Date(today);d.setDate(today.getDate()-i);
    const ml=i===0?S.ml:S.hist[6-i];
    rows.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())},${ml},${S.goal},${ml>=S.goal?'sim':'não'}`);
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download='relatorio-agua.csv';a.click();
}

// Tick a cada 15 s: atualiza o status, re-renderiza ao virar o minuto e dispara o alerta no horário
setInterval(()=>{
  const st=statusInfo();
  const pill=document.getElementById('pill'),sub=document.getElementById('sub');
  if(pill){pill.textContent=st.txt;pill.className='pill '+st.tone}
  if(sub)sub.textContent=st.sub;
  const m=nowMin(),d=new Date();
  if(m!==lastMin){
    lastMin=m;
    if(S.view==='hoje'&&document.activeElement?.tagName!=='INPUT')render();
  }
  if(S.days[d.getDay()]&&times().includes(m)&&lastFire!==m){lastFire=m;alertOn(false)}
},15000);

render();
</script>
</body>
