<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WRS Tools</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0f2a3d;
       background:radial-gradient(900px 500px at 50% -10%,#bfeaf8 0%,transparent 65%),linear-gradient(180deg,#eef9fd 0%,#ffffff 100%);
       display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .box{display:flex;flex-direction:column;align-items:center;gap:12px;position:relative}
  svg{width:140px;height:198px}
  #clock,#cal{width:160px;height:160px}
  h1{font-size:44px;font-weight:800;letter-spacing:-.03em;margin:8px 0 0}
  p{margin:0;color:#5b7283;font-size:18px}
  .row{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;font-weight:600;font-size:17px;padding:14px 26px;border-radius:99px;border:1px solid #cfe3ea;background:#fff;color:#0f2a3d;cursor:pointer}
  button.dark{background:#167aa6;border-color:#167aa6;color:#fff}
  button:hover{opacity:.88}
  .x{display:none;position:absolute;top:6px;right:8px;border:0;background:none;font-size:22px;line-height:1;padding:4px 9px;color:#5b7283;border-radius:8px}
  .x:hover{background:#eef7fb;opacity:1}

  /* Aviso no canto: caixinha compacta que vibra até a pessoa clicar */
  body.corner{background:#eef7fb;padding:10px}
  body.corner .box{width:100%;height:100%;justify-content:center;gap:4px;background:#fff;border:2px solid #38c4ea;border-radius:18px;
                   box-shadow:0 10px 28px rgba(15,42,61,.18);padding:14px 18px}
  body.corner .x{display:block}
  body.corner svg{width:44px;height:62px}
  body.corner #clock,body.corner #cal{width:54px;height:54px}
  body.corner h1{font-size:22px;margin:2px 0 0}
  body.corner p{font-size:14px}
  body.corner .row{margin-top:10px;gap:8px}
  body.corner button{font-size:14px;padding:9px 16px}
  body.corner.ringing .box{animation:shake 1.6s ease-in-out infinite}
  /* rajada de vibração no começo de cada ciclo, depois uma pausa */
  @keyframes shake{
    0%,42%,100%{transform:translateX(0) rotate(0)}
    6%{transform:translateX(-7px) rotate(-1.5deg)}
    12%{transform:translateX(7px) rotate(1.5deg)}
    18%{transform:translateX(-6px) rotate(-1deg)}
    24%{transform:translateX(6px) rotate(1deg)}
    30%{transform:translateX(-3px)}
    36%{transform:translateX(3px)}
  }
  /* Tema escuro: segue a escolha do app (nativeTheme) via prefers-color-scheme */
  :root{color-scheme:light dark}
  @media (prefers-color-scheme:dark){
    body{color:#e6f1f6;background:radial-gradient(900px 500px at 50% -10%,#123a4d 0%,transparent 65%),linear-gradient(180deg,#0f1d28 0%,#0b1620 100%)}
    p{color:#93abb8}
    button{background:#12212d;border-color:#23384a;color:#e6f1f6}
    button.dark{background:#14709a;border-color:#14709a;color:#fff}
    .x{color:#93abb8}
    .x:hover{background:#182b39}
    body.corner{background:#0b1620}
    body.corner .box{background:#12212d;border-color:#1b8fc0;box-shadow:0 10px 28px rgba(0,0,0,.45)}
  }
  @media (prefers-reduced-motion:reduce){ body.corner.ringing .box{animation:none} }
  @media (max-width:520px){ body:not(.corner) h1{font-size:32px} }
</style>
</head>
<body>
  <div class="box">
    <button class="x" id="x">×</button>
    <svg id="glass" viewBox="0 0 120 170" aria-hidden="true">
      <defs><clipPath id="cp"><path d="M46 10h28v18l14 22v98a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V50l14-22z"/></clipPath></defs>
      <g clip-path="url(#cp)"><rect x="0" y="72" width="120" height="110" fill="#bfeaf8"/>
        <path d="M-30 72q15-8 30 0t30 0t30 0t30 0t30 0t30 0V170H-30z" fill="#38c4ea"/></g>
      <path d="M46 10h28v18l14 22v98a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V50l14-22z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M52 4h16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <svg id="clock" viewBox="0 0 160 160" aria-hidden="true" style="display:none">
      <circle cx="80" cy="80" r="70" fill="#e7e4ff" stroke="currentColor" stroke-width="3"/>
      <path d="M80 30v50l34 20" fill="none" stroke="#7c6cf0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="80" cy="80" r="6" fill="currentColor"/>
    </svg>
    <svg id="cal" viewBox="0 0 160 160" aria-hidden="true" style="display:none">
      <rect x="18" y="30" width="124" height="112" rx="18" fill="#ffe3d9" stroke="currentColor" stroke-width="3"/>
      <path d="M18 64h124" stroke="currentColor" stroke-width="3"/>
      <path d="M52 18v24M108 18v24" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      <rect x="44" y="84" width="30" height="26" rx="7" fill="#ff7a59"/>
    </svg>
    <h1 id="title"></h1>
    <p id="sub"></p>
    <div class="row">
      <button id="b1" class="dark"></button>
      <button id="b2"></button>
    </div>
  </div>
<script src="i18n.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const lang = I18N.LANGS.includes(params.get('lang')) ? params.get('lang') : I18N.DEFAULT_LANG;
  const T = (key, vars) => I18N.t(lang, key, vars);
  const $ = id => document.getElementById(id);
  document.documentElement.lang = lang;

  // Modo: tela cheia (padrão) ou aviso no canto, que vibra até a pessoa clicar
  if (params.get('mode') === 'corner') document.body.classList.add('corner', 'ringing');
  $('x').setAttribute('aria-label', T('al.close'));
  $('x').title = T('al.close');
  $('x').onclick = () => window.agua.closeAlert();

  // Se veio um horário de ponto na URL, mostra o alerta de ponto; senão, o de água
  const ponto = params.get('ponto');
  const event = params.get('event'); // título do compromisso da agenda
  if (event) {
    $('glass').style.display = 'none';
    $('cal').style.display = '';
    $('title').textContent = T('al.event.title');
    $('sub').textContent = T('al.event.sub', { t: event, h: params.get('at') || '' });
    $('b1').textContent = T('al.event.done');
    $('b1').onclick = () => window.agua.closeAlert();
    $('b2').textContent = T('al.event.snooze');
    $('b2').onclick = () => window.agua.eventSnooze();
  } else if (ponto) {
    $('glass').style.display = 'none';
    $('clock').style.display = '';
    $('title').textContent = T('al.ponto.title');
    $('sub').textContent = T('al.ponto.sub', { t: ponto });
    $('b1').textContent = T('al.ponto.done');
    $('b1').onclick = () => window.agua.pontoDone();
    $('b2').textContent = T('al.ponto.snooze');
    $('b2').onclick = () => window.agua.pontoSnooze();
  } else {
    $('title').textContent = T('al.water.title');
    $('sub').textContent = T('al.water.sub');
    $('b1').textContent = T('al.water.done');
    $('b1').onclick = () => window.agua.drink();
    $('b2').textContent = T('al.water.snooze');
    $('b2').onclick = () => window.agua.snooze();
  }

  // Bipe padrão gerado pelo próprio navegador (sem arquivo de áudio)
  let ctx = null;
  function beep() {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume();
      [0, 0.45].forEach(t => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.4);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.42);
      });
    } catch (e) {}
  }
  // Toca o bipe uma vez ou, com "som contínuo", a cada 2,5 s. Devolve a função que para.
  function startBeep(loop) {
    beep();
    if (!loop) return () => {};
    const id = setInterval(beep, 2500);
    return () => clearInterval(id);
  }

  // Som: desligado → nada; .mp4 escolhido → toca o arquivo (em loop se contínuo); falhou → bipe
  let stopped = false;
  let stopSound = () => {};
  if (params.get('sound') !== '0') {
    const loop = params.get('loop') === '1';
    const src = params.get('src');
    if (src) {
      const audio = new Audio(src);
      audio.loop = loop;
      let fell = false;
      const fallback = () => { if (!fell && !stopped) { fell = true; stopSound = startBeep(loop); } };
      audio.onerror = fallback;
      audio.play().catch(fallback);
      stopSound = () => audio.pause();
    } else {
      stopSound = startBeep(loop);
    }
  }

  // Clicou em qualquer lugar do aviso: para o som e a vibração (os botões continuam funcionando)
  document.addEventListener('pointerdown', () => {
    stopped = true;
    stopSound();
    document.body.classList.remove('ringing');
  }, { once: true });
</script>
</body>
</html>
