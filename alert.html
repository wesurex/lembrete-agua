<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Água</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:#111;
       display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center}
  svg{width:140px;height:198px}
  #clock{width:160px;height:160px}
  h1{font-size:44px;font-weight:800;letter-spacing:-.03em;margin:8px 0 0}
  p{margin:0;color:#6b6b6b;font-size:18px}
  .row{display:flex;gap:12px;margin-top:24px}
  button{font:inherit;font-weight:600;font-size:17px;padding:14px 26px;border-radius:99px;border:1px solid #111;background:#fff;color:#111;cursor:pointer}
  button.dark{background:#111;color:#fff}
  button:hover{opacity:.85}
</style>
</head>
<body>
  <svg id="glass" viewBox="0 0 120 170" aria-hidden="true">
    <defs><clipPath id="cp"><path d="M46 10h28v18l14 22v98a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V50l14-22z"/></clipPath></defs>
    <g clip-path="url(#cp)"><rect x="0" y="72" width="120" height="110" fill="#cdeaf7"/>
      <path d="M-30 72q15-8 30 0t30 0t30 0t30 0t30 0t30 0V170H-30z" fill="#8fd0ee"/></g>
    <path d="M46 10h28v18l14 22v98a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V50l14-22z" fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M52 4h16" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <svg id="clock" viewBox="0 0 160 160" aria-hidden="true" style="display:none">
    <circle cx="80" cy="80" r="70" fill="#cdeaf7" stroke="#111" stroke-width="3"/>
    <path d="M80 30v50l34 20" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="80" cy="80" r="5" fill="#111"/>
  </svg>
  <h1 id="title">Hora de beber água</h1>
  <p id="sub">Um copo agora ajuda a manter a meta do dia.</p>
  <div class="row">
    <button id="b1" class="dark">Já bebi</button>
    <button id="b2">Adiar 10 min</button>
  </div>
<script>
  // Se veio um horário de ponto na URL, mostra o alerta de ponto; senão, o de água
  const ponto = new URLSearchParams(location.search).get('ponto');
  if (ponto) {
    document.getElementById('glass').style.display = 'none';
    document.getElementById('clock').style.display = '';
    document.getElementById('title').textContent = 'Hora de bater o ponto';
    document.getElementById('sub').textContent = `Marcação das ${ponto}. Bata agora.`;
    document.getElementById('b1').textContent = 'Já bati';
    document.getElementById('b1').onclick = () => window.agua.pontoDone();
    document.getElementById('b2').textContent = 'Adiar 5 min';
    document.getElementById('b2').onclick = () => window.agua.pontoSnooze();
  } else {
    document.getElementById('b1').onclick = () => window.agua.drink();
    document.getElementById('b2').onclick = () => window.agua.snooze();
  }

  // Som de alerta gerado pelo próprio navegador (sem arquivo de áudio); pode ser desligado nas configurações
  if (new URLSearchParams(location.search).get('sound') !== '0') try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    c.resume();
    [0, 0.45].forEach(t => {
      const o = c.createOscillator(), g = c.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(0.0001, c.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.3, c.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t + 0.4);
      o.start(c.currentTime + t); o.stop(c.currentTime + t + 0.42);
    });
  } catch (e) {}
</script>
</body>
</html>
