<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Água</title>
<style>
  *{box-sizing:border-box}
  :root{--ink:#111;--ink2:#6b6b6b;--line:#e8e8e8;--bg:#f4f4f4;--blue:#cdeaf7;--water:#8fd0ee;--green:#2f9e44;--yellow:#ffd43b;--red:#e03131}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  aside{background:#fff;border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column;gap:6px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:0 12px 24px}
  nav{display:flex;flex-direction:column;gap:6px}
  nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:12px;font:inherit;color:var(--ink2);cursor:pointer;text-align:left}
  nav button:hover{background:#f2f2f2}
  nav button.on{background:var(--ink);color:#fff}
  .foot{margin-top:auto;padding:12px;font-size:12px;color:var(--ink2)}
  main{padding:32px 36px;max-width:1180px;width:100%}
  h1{font-size:34px;font-weight:800;margin:4px 0 0;letter-spacing:-.03em}
  h2{font-size:16px;margin:0 0 4px}
  h3{font-size:16px;margin:0 0 10px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .cap{margin:0;color:var(--ink2)}
  .muted{color:var(--ink2);margin:0}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
  .kpi strong{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
  .kpi strong span{font-size:14px;color:var(--ink2);font-weight:500}
  .kicon{display:inline-flex;width:38px;height:38px;align-items:center;justify-content:center;border-radius:12px;background:#f2f2f2}
  .kpi.blue{background:var(--blue);border-color:var(--blue)}
  .kpi.blue .kicon{background:#fff}
  .main-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .hero{position:relative;overflow:hidden;display:flex;gap:32px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,#fff 0%,#f3f3f3 100%)}
  .deco{position:absolute;right:-60px;bottom:-80px;width:380px;height:auto;pointer-events:none}
  .glass{width:124px;height:176px;flex:none;position:relative}
  .big{font-size:60px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
  .big span{font-size:20px;color:var(--ink2);font-weight:500}
  .bar{height:8px;background:#e6e6e6;border-radius:99px;margin:16px 0 22px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--water);border-radius:99px;transition:width .4s}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:600;padding:11px 18px;border-radius:99px;border:1px solid var(--ink);cursor:pointer;background:#fff;color:var(--ink)}
  .btn.dark{background:var(--ink);color:#fff}
  .btn:hover{opacity:.85}
  .ic{width:18px;height:18px;flex:none}
  .pill{font-size:13px;font-weight:600;padding:6px 14px;border-radius:99px;border:1px solid var(--ink);white-space:nowrap}
  .pill.on{background:var(--ink);color:#fff}
  .pill.off{color:var(--ink2);border-color:var(--line)}
  .pill.wait{border-style:dashed}
  .dark{background:#111;border-color:#111;color:#fff}
  .dark h2{color:#fff}
  .dark .muted{color:#9a9a9a}
  .rings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
  .ring{text-align:center}
  .ring svg{width:100%;max-width:110px;display:block;margin:0 auto}
  .rt{fill:none;stroke:#2a2a2a;stroke-width:8}
  .rv{fill:none;stroke:var(--water);stroke-width:8;stroke-linecap:round}
  .ring strong{display:block;font-size:22px;font-weight:800;margin-top:8px}
  .ring small{color:#9a9a9a;font-size:12px}
  .card.blue{background:var(--blue);border-color:var(--blue)}
  .arc{width:100%;max-width:260px;display:block;margin:10px auto 0}
  .arc-bg{fill:none;stroke:rgba(17,17,17,.12);stroke-width:14;stroke-linecap:round}
  .arc-v{fill:none;stroke:#111;stroke-width:14;stroke-linecap:round}
  .arc-t{font-size:26px;font-weight:800;fill:#111}
  .times{list-style:none;padding:0;margin:14px 0 0}
  .times li{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
  .times li span{font-variant-numeric:tabular-nums;font-weight:600}
  .times li small{color:var(--ink2)}
  .times li.past span{color:#aaa;text-decoration:line-through}
  .times li.next small{color:var(--ink);font-weight:700}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .stats strong{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .stats small{color:var(--ink2);font-size:13px}
  .nav2{display:flex;align-items:center;gap:8px}
  .nav2 button{font:inherit;border:1px solid var(--ink);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer}
  .nav2 span{min-width:160px;text-align:center;font-weight:700}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dow{font-size:12px;color:var(--ink2);text-align:center;padding:4px 0}
  .day{aspect-ratio:1/0.85;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);padding:0}
  .day small{font-size:11px;font-weight:500}
  .day.met{background:var(--green);border-color:var(--green);color:#fff}
  .day.part{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
  .day.none{background:var(--red);border-color:var(--red);color:#fff}
  .day.future{color:#b5b5b5}
  .day.sel{outline:2px solid var(--ink);outline-offset:2px}
  .legend{font-size:13px;color:var(--ink2);margin-top:12px;display:flex;gap:16px;flex-wrap:wrap}
  .sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:middle;margin-right:6px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid3 strong{display:block;font-size:20px;font-weight:800}
  .grid3 small{color:var(--ink2);font-size:13px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2)}
  input[type=time],input[type=number]{font:inherit;color:var(--ink);padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
  .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{font:inherit;font-size:14px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.day{width:46px;padding:8px 0;text-align:center}
  .chip-input{width:120px;border-radius:99px;padding:7px 12px}
  .actions{display:flex;align-items:center;gap:12px;margin-top:20px}
  #msg{color:var(--ink2);font-size:14px}
  #msg.err{color:var(--ink);font-weight:600}
  .overlay-hint{font-size:13px;color:var(--ink2)}
  .label{font-size:13px;color:var(--ink2);margin:16px 0 8px;font-weight:600}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .switch{position:relative;width:44px;height:26px;border-radius:99px;border:1px solid var(--ink);background:#fff;cursor:pointer;padding:0;flex:none}
  .switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:.2s}
  .switch.on{background:var(--ink)}
  .switch.on i{left:21px;background:#fff}
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    aside{flex-direction:row;overflow-x:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line);align-items:center}
    .brand{padding:0 8px 0 0;white-space:nowrap}
    nav{flex-direction:row}
    nav button{white-space:nowrap}
    .foot{display:none}
    main{padding:20px 16px}
    .kpis,.stats{grid-template-columns:1fr 1fr}
    .main-grid,.grid{grid-template-columns:1fr}
    .big{font-size:46px}
    .grid3{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  </defs>
</svg>

<div class="app">
  <aside>
    <div class="brand"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-drop"/></svg>Água</div>
    <nav>
      <button data-v="hoje" class="on" onclick="go('hoje')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-home"/></svg>Hoje</button>
      <button data-v="rel" onclick="go('rel')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chart"/></svg>Relatórios</button>
      <button data-v="cfg" onclick="go('cfg')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-sliders"/></svg>Configurações</button>
    </nav>
    <p class="foot">Funciona offline · sem conta</p>
  </aside>
  <main id="main"></main>
</div>

<script>
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const PRESETS = [30, 45, 60, 90, 120];
  const EMPTY = { ml: 0, drinks: 0, fired: 0, atendidos: 0, missed: 0 };
  const toM = h => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
  const fmt = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  let V = 'hoje', R = null, C = null, sel = null, msg = { text: '', err: false };
  let cur = new Date(); cur = new Date(cur.getFullYear(), cur.getMonth(), 1);

  const ic = n => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${n}"/></svg>`;

  function times() {
    const r = [];
    for (let t = toM(C.start) + C.iv; t <= toM(C.end); t += C.iv) r.push(t);
    return r;
  }
  function statusInfo() {
    const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
    if (!C.days[d.getDay()]) return { tone: 'off', txt: 'Dia desligado', sub: 'Sem lembretes hoje' };
    if (m < toM(C.start)) return { tone: 'wait', txt: 'Começa às ' + C.start, sub: 'Primeiro lembrete depois do início' };
    if (m > toM(C.end)) return { tone: 'off', txt: 'Encerrado por hoje', sub: 'Volta amanhã às ' + C.start };
    const nx = times().find(t => t > m);
    if (nx === undefined) return { tone: 'off', txt: 'Sem lembretes restantes', sub: 'Expediente de lembretes concluído' };
    const diff = nx - m;
    const dt = diff >= 60 ? Math.floor(diff / 60) + 'h' + pad(diff % 60) : diff + ' min';
    return { tone: 'on', txt: 'Próximo em ' + dt, sub: 'Às ' + fmt(nx) };
  }

  function glass(p) {
    const y = 152 - 140 * p;
    const shape = "M46 10h28v18l14 22v98a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V50l14-22z";
    return `<svg class="glass" viewBox="0 0 120 170" aria-hidden="true">
      <defs><clipPath id="cp"><path d="${shape}"/></clipPath></defs>
      <g clip-path="url(#cp)"><g transform="translate(0 ${y})"><g class="wv"><path d="M-30 0q15-8 30 0t30 0t30 0t30 0t30 0t30 0V170H-30z" fill="#8fd0ee"/></g></g>
      <rect x="0" y="${y + 30}" width="120" height="140" fill="#cdeaf7"/></g>
      <path d="${shape}" fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M52 4h16" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    </svg>`;
  }
  function ring(v, label) {
    const c = 2 * Math.PI * 34, x = Math.max(0, Math.min(v, 1));
    return `<div class="ring"><svg viewBox="0 0 84 84" aria-hidden="true">
      <circle cx="42" cy="42" r="34" class="rt"/>
      <circle cx="42" cy="42" r="34" class="rv" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - x)}" transform="rotate(-90 42 42)"/>
    </svg><strong>${Math.round(x * 100)}%</strong><small>${label}</small></div>`;
  }
  function arc(p) {
    return `<svg class="arc" viewBox="0 0 200 116" aria-hidden="true">
      <path d="M10 104 A90 90 0 0 1 190 104" pathLength="100" class="arc-bg"/>
      <path d="M10 104 A90 90 0 0 1 190 104" pathLength="100" class="arc-v" stroke-dasharray="${p * 100} 100"/>
      <text x="100" y="98" text-anchor="middle" class="arc-t">${Math.round(p * 100)}%</text>
    </svg>`;
  }
  function kpi(cls, icon, label, val, unit) {
    return `<section class="card kpi ${cls}"><span class="kicon">${ic(icon)}</span><p class="muted" style="margin-top:12px">${label}</p><strong>${val}${unit ? ` <span>${unit}</span>` : ''}</strong></section>`;
  }

  function viewHoje() {
    const now = new Date(), nowM = now.getHours() * 60 + now.getMinutes();
    const t = R.days[keyOf(now)] || EMPTY;
    const goal = C.goalMl, p = Math.min(t.ml / goal, 1);
    const ts = times(), nx = ts.find(x => x > nowM), passed = ts.filter(x => x <= nowM).length;
    const st = statusInfo();
    const gp = nx === undefined ? 0 : Math.min(Math.max((nowM - (nx - C.iv)) / C.iv, 0), 1);
    const rows = ts.map(x => {
      const c = x < nowM ? 'past' : x === nx ? 'next' : '';
      const lb = x < nowM ? 'passou' : x === nx ? 'próximo' : 'agendado';
      return `<li class="${c}"><span>${fmt(x)}</span><small>${lb}</small></li>`;
    }).join('') || '<li class="muted">Nenhum horário com essa configuração</li>';
    const dt = now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
    return `
    <header class="top">
      <div><p class="cap">${dt}</p><h1>Hoje</h1></div>
      <span class="pill ${st.tone}">${st.txt}</span>
    </header>
    <div class="kpis">
      ${kpi('blue', 'drop', 'Água hoje', t.ml, 'ml')}
      ${kpi('', 'check', 'Copos bebidos', t.drinks)}
      ${kpi('', 'bell', 'Lembretes hoje', ts.length)}
      ${kpi('', 'clock', 'Atendidos', `${t.atendidos} de ${t.fired}`)}
    </div>
    <div class="main-grid">
      <section class="card hero">
        <svg class="deco" viewBox="0 0 380 260" aria-hidden="true" fill="none" stroke="#d9d9d9" stroke-width="1.5">
          <path d="M0 160c60-60 120 40 180-20s110-60 200 10"/>
          <path d="M0 200c70-50 130 30 190-10s100-50 190 5"/>
          <path d="M20 120c50-30 100 30 150-5s90-30 160 10"/>
        </svg>
        ${glass(p)}
        <div style="position:relative">
          <p class="muted">Meta de água de hoje</p>
          <div class="big">${t.ml} <span>ml</span></div>
          <p class="muted">de ${goal} ml · faltam ${Math.max(goal - t.ml, 0)} ml</p>
          <div class="bar"><i style="width:${p * 100}%"></i></div>
          <div class="row"><button class="btn" onclick="agua.testAlert()">${ic('bell')} Testar alerta</button></div>
        </div>
      </section>
      <section class="card dark">
        <h2>Progresso de hoje</h2>
        <p class="muted">${st.sub}</p>
        <div class="rings">
          ${ring(p, 'Meta')}
          ${ring(ts.length ? passed / ts.length : 0, 'Lembretes')}
          ${ring(t.fired ? t.atendidos / t.fired : 0, 'Atendidos')}
        </div>
      </section>
    </div>
    <div class="grid">
      <section class="card blue">
        <h2>Próximo lembrete</h2>
        <p class="muted">${nx === undefined ? st.txt : 'Às ' + fmt(nx) + ' · a cada ' + C.iv + ' min'}</p>
        ${arc(gp)}
      </section>
      <section class="card">
        <h2>Lembretes de hoje</h2>
        <p class="muted">Entre ${C.start} e ${C.end}</p>
        <ul class="times">${rows}</ul>
      </section>
    </div>`;
  }

  function viewRel() {
    const y = cur.getFullYear(), m = cur.getMonth(), n = new Date(y, m + 1, 0).getDate(), off = new Date(y, m, 1).getDay();
    const goal = R.goalMl, hoje = keyOf(new Date());
    let tot = 0, drinks = 0, fired = 0, att = 0, miss = 0, metDays = 0, recDays = 0;
    let cells = DOW.map(d => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < off; i++) cells += '<div></div>';
    for (let d = 1; d <= n; d++) {
      const k = `${y}-${pad(m + 1)}-${pad(d)}`, s = R.days[k];
      let cls = k > hoje ? 'future' : 'none', sub = '';
      if (s) {
        tot += s.ml; drinks += s.drinks; fired += s.fired; att += s.atendidos; miss += s.missed; recDays++;
        if (s.ml >= goal) { cls = 'met'; metDays++; } else if (s.ml > 0) cls = 'part';
        sub = Math.round(s.ml / goal * 100) + '%';
      }
      cells += `<button class="day ${cls} ${sel === k ? 'sel' : ''}" onclick="pickDay('${k}')">${d}<small>${sub}</small></button>`;
    }
    return `
    <header class="top">
      <div><p class="cap">Histórico</p><h1>Relatórios</h1></div>
      <div class="nav2">
        <button onclick="shiftMonth(-1)" aria-label="Mês anterior">←</button>
        <span>${MESES[m]} ${y}</span>
        <button onclick="shiftMonth(1)" aria-label="Próximo mês">→</button>
      </div>
    </header>
    <div class="stats">
      <section class="card" style="padding:16px"><small class="muted">Água no mês</small><strong>${tot} ml</strong></section>
      <section class="card" style="padding:16px"><small class="muted">Copos bebidos</small><strong>${drinks}</strong></section>
      <section class="card" style="padding:16px"><small class="muted">Lembretes atendidos</small><strong>${att} de ${fired}</strong></section>
      <section class="card" style="padding:16px"><small class="muted">Dias na meta</small><strong>${metDays} de ${recDays}</strong></section>
    </div>
    <section class="card">
      <div class="cal">${cells}</div>
      <div class="legend">
        <span><i class="sw" style="background:#2f9e44"></i>Meta batida</span>
        <span><i class="sw" style="background:#ffd43b"></i>Bebeu, mas não bateu</span>
        <span><i class="sw" style="background:#e03131"></i>Sem registro</span>
      </div>
    </section>
    <section class="card" style="margin-top:20px">${detail(goal, miss)}</section>`;
  }

  function detail(goal, missMonth) {
    if (!sel) return `<p class="muted">Toque em um dia para ver o detalhe. Lembretes perdidos no mês: ${missMonth}.</p>`;
    const [y, m, d] = sel.split('-').map(Number);
    const title = `${d} de ${MESES[m - 1]} de ${y}`;
    const s = R.days[sel];
    if (!s) return `<h3>${title}</h3><p class="muted">Sem registros nesse dia.</p>`;
    const pct = Math.round(s.ml / goal * 100);
    return `<h3>${title}</h3>
      <div class="grid3">
        <div><small>Bebeu</small><strong>${s.ml} ml</strong><small>${pct}% da meta de ${goal} ml</small></div>
        <div><small>Copos</small><strong>${s.drinks}</strong></div>
        <div><small>Lembretes</small><strong>${s.atendidos} de ${s.fired}</strong><small>${s.missed} perdido(s)</small></div>
      </div>`;
  }

  function viewCfg() {
    return `
    <header class="top">
      <div><p class="cap">Ajustes do lembrete</p><h1>Configurações</h1></div>
    </header>
    <div class="grid">
      <section class="card">
        <h2>Horário</h2>
        <div class="fields">
          <label>Início<input type="time" value="${C.start}" onchange="C.start=this.value"></label>
          <label>Fim<input type="time" value="${C.end}" onchange="C.end=this.value"></label>
        </div>
      </section>
      <section class="card">
        <h2>Intervalo entre lembretes</h2>
        <div class="chips" style="margin-top:10px">
          ${PRESETS.map(n => `<button class="chip ${C.iv === n ? 'on' : ''}" onclick="setIv(${n})">${n} min</button>`).join('')}
          <input class="chip-input" type="number" min="5" max="480" value="${C.iv}" onchange="setIv(this.value)" aria-label="Intervalo personalizado em minutos">
        </div>
      </section>
      <section class="card">
        <h2>Meta diária</h2>
        <div class="chips" style="margin-top:10px">
          <input class="chip-input" type="number" min="500" max="6000" step="250" value="${C.goalMl}" onchange="C.goalMl=Number(this.value)" aria-label="Meta diária em ml">
          <span class="muted">ml por dia</span>
        </div>
      </section>
      <section class="card">
        <h2>Dias de funcionamento</h2>
        <div class="chips" style="margin-top:10px">
          ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map((d, i) => `<button class="chip day ${C.days[i] ? 'on' : ''}" onclick="toggleDay(${i})">${d}</button>`).join('')}
        </div>
      </section>
      ${cardPonto()}
    </div>
    <div class="actions">
      <button class="btn dark" onclick="saveCfg()">Salvar</button>
      <span id="msg" class="${msg.err ? 'err' : ''}">${msg.text}</span>
    </div>`;
  }

  function render() {
    $('main').innerHTML = { hoje: viewHoje, rel: viewRel, cfg: viewCfg }[V]();
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === V));
  }
  function go(v) { V = v; msg = { text: '', err: false }; render(); }
  function setIv(n) { const v = Number(n); if (v >= 5 && v <= 480) { C.iv = v; render(); } }
  function toggleDay(i) { C.days[i] = !C.days[i]; render(); }
  function shiftMonth(d) { cur = new Date(cur.getFullYear(), cur.getMonth() + d, 1); render(); }
  function pickDay(k) { sel = k; render(); }

  function cardPonto() {
    const p = C.ponto;
    const rows = p.times.map((t, i) => `
      <div class="chips" style="margin-top:8px">
        <input type="time" value="${t}" onchange="setPontoTime(${i}, this.value)" aria-label="Horário ${i + 1}">
        <button class="chip" onclick="removePontoTime(${i})" aria-label="Remover horário">×</button>
      </div>`).join('');
    return `
    <section class="card">
      <div class="toggle-row">
        <h2 style="margin:0">Bater o ponto</h2>
        <button class="switch ${p.enabled ? 'on' : ''}" role="switch" aria-checked="${p.enabled}" onclick="togglePonto()" aria-label="Lembrar de bater o ponto"><i></i></button>
      </div>
      <p class="label">Você é CLT?</p>
      <div class="chips">
        <button class="chip ${p.clt ? 'on' : ''}" onclick="setPontoClt(true)">Sim</button>
        <button class="chip ${!p.clt ? 'on' : ''}" onclick="setPontoClt(false)">Não</button>
      </div>
      <p class="muted" style="margin-top:8px">${p.clt ? 'CLT: mínimo de 4 batidas (entrada, saída para o almoço, volta e saída).' : 'Mínimo de 2 batidas.'}</p>
      ${rows}
      <div class="chips" style="margin-top:12px">
        <button class="chip" onclick="addPontoTime()">+ Adicionar horário</button>
      </div>
      <p class="label">Dias do ponto</p>
      <div class="chips">
        ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map((d, i) => `<button class="chip day ${p.days[i] ? 'on' : ''}" onclick="togglePontoDay(${i})">${d}</button>`).join('')}
      </div>
      <p class="label">Avisar antes</p>
      <div class="chips">
        ${[0, 5, 10, 15].map(n => `<button class="chip ${p.leadMin === n ? 'on' : ''}" onclick="setPontoLead(${n})">${n === 0 ? 'na hora' : n + ' min'}</button>`).join('')}
      </div>
    </section>`;
  }
  function togglePonto() { C.ponto.enabled = !C.ponto.enabled; render(); }
  function togglePontoDay(i) { C.ponto.days[i] = !C.ponto.days[i]; render(); }
  function setPontoClt(v) {
    C.ponto.clt = v;
    const base = ['08:00', '12:00', '13:00', '17:00'];
    while (v && C.ponto.times.length < 4) C.ponto.times.push(base[C.ponto.times.length]);
    render();
  }
  function setPontoTime(i, v) { C.ponto.times[i] = v; render(); }
  function removePontoTime(i) { C.ponto.times.splice(i, 1); render(); }
  function addPontoTime() { C.ponto.times.push('12:00'); render(); }
  function setPontoLead(n) { C.ponto.leadMin = n; render(); }

  async function saveCfg() {
    const r = await agua.saveConfig({ start: C.start, end: C.end, iv: C.iv, goalMl: C.goalMl, days: C.days, ponto: C.ponto });
    msg = r.ok ? { text: 'Salvo. Vale a partir de agora.', err: false } : { text: r.error, err: true };
    render();
  }

  (async () => {
    C = await agua.getConfig();
    R = await agua.getReport();
    render();
    // Atualiza Hoje e Relatórios sem mexer no formulário de configurações
    setInterval(async () => {
      R = await agua.getReport();
      if (V !== 'cfg') render();
    }, 20000);
  })();
</script>
</body>
</html>
